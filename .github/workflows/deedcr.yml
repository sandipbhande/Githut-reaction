name: Docker CI/CD with Watchtower + SonarQube

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-scan-push:
    name: Build, Sonar Scan & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Login to Docker Hub using secrets
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-image:latest .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-image:latest

      # 5. Run the container with Node.js app (detached & port mapping)
      - name: Run Docker container
        run: |
          docker stop nodejs-container || true
          docker rm nodejs-container || true
          docker run -d --name nodejs-container -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/my-image:latest

      
    




