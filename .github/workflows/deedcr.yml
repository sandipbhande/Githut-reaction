name: Docker CI/CD with Watchtower + SonarQube

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

  
      # 5. CLEAN secrets (🔥 FIXES YOUR ERROR)
      - name: Clean Docker credentials
        run: |
          echo "DOCKER_USERNAME_CLEAN=$(echo '${{ secrets.DOCKER_USERNAME }}' | tr -d '\n' | xargs)" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD_CLEAN=$(echo '${{ secrets.DOCKER_PASSWORD }}' | tr -d '\n' | xargs)" >> $GITHUB_ENV

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD_CLEAN" | docker login \
            -u "$DOCKER_USERNAME_CLEAN" \
            --password-stdin

      # 7. Build Docker Image (FIXED)
      - name: Build Docker image
        run: |
          docker build \
            -t "$DOCKER_USERNAME_CLEAN/my-image:latest" \
            -t "$DOCKER_USERNAME_CLEAN/my-image:${{ github.sha }}" \
            .

      # 8. Push Docker Image
      - name: Push Docker image
        run: |
          docker push "$DOCKER_USERNAME_CLEAN/my-image:latest"
          docker push "$DOCKER_USERNAME_CLEAN/my-image:${{ github.sha }}"
