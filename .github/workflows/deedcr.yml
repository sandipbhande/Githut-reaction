name: Docker CI/CD with Watchtower + SonarQube

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Debug (optional but helpful)
      - name: Verify files
        run: ls -la

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 4. Install dependencies (optional but recommended)
      - name: Install dependencies
        run: npm install

      # 5. Run tests (optional)
      - name: Run tests
        run: npm test || true


      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 8. Build Docker Image (FIXED)
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/my-image:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/my-image:${{ github.sha }}" \
            .

      # 9. Push Docker Image
      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/my-image:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/my-image:${{ github.sha }}"
