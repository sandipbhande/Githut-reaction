name: Docker CI/CD with Watchtower + SonarQube

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Login to Docker Hub ✅ (FIXED INDENTATION)
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 5. Build Docker Image ✅ (NO CLEAN VAR NEEDED)
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/my-image:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/my-image:${{ github.sha }}" \
            .

      # 6. Push Docker Image
      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/my-image:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/my-image:${{ github.sha }}"
